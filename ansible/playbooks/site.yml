# Maps host groups to roles. Each play targets one group.

# Install Galaxy collections before any other play runs.
# Keeps the playbook self-contained, no manual setup needed.
- name: Install required Ansible collections
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Run ansible-galaxy collection install
      ansible.builtin.command:
        cmd: ansible-galaxy collection install -p ./collections -r collections/requirements.yml
        chdir: "{{ playbook_dir }}/.."
      changed_when: false

# gather_facts collects OS, mounts and hostname before
# tasks run. The role uses it for disk and identity checks.
- name: Verify control-node readiness
  hosts: control
  gather_facts: true
  roles:
    - control_node_check

- name: Harden SSH on all hosts
  hosts: all
  become: true
  tags: ['ssh_hardening']
  roles:
    - role: devsec.hardening.ssh_hardening
      vars:
        # Keep port 22 — we use ProxyJump
        ssh_server_ports: ['22']

        # Only key auth, no root login
        ssh_permit_root_login: "no"
        ssh_server_password_login: false
        ssh_challengeresponseauthentication: false

        # Keep PAM active for automation user sudo
        ssh_use_pam: true

        # Disable forwarding
        ssh_allow_tcp_forwarding: "no"
        ssh_allow_agent_forwarding: false
        ssh_x11_forwarding: false

- name: Common baseline on all hosts
  hosts: all
  become: true
  roles:
    - common

- name: Configure database server
  hosts: db
  become: true
  roles:
    - postgres_server

- name: Configure web servers
  hosts: web
  become: true
  roles:
    - flask_app

- name: Configure load balancer
  hosts: lb
  become: true
  roles:
    - nginx_lb