# Packages here are prerequisites for flask_app and
# postgres_server. Without them, later roles fail.

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    # Skips update if cache is younger than this value
    # (seconds). Defined in group_vars/all.yml.
    cache_valid_time: "{{ apt_cache_valid_time }}"
  become: true

- name: Install baseline packages
  ansible.builtin.apt:
    name:
      - python3
      - python3-apt
      - python3-pip
      - sudo
      - curl
      - ca-certificates
      - gnupg
      - lsb-release
    state: present
  become: true

- name: Set timezone
  community.general.timezone:
    name: "{{ common_timezone }}"
  become: true

- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present
  become: true

- name: UFW | Set default incoming policy to deny
  community.general.ufw:
    direction: incoming
    default: deny
  become: true

- name: UFW | Set default outgoing policy to allow
  community.general.ufw:
    direction: outgoing
    default: allow
  become: true

- name: UFW | Allow SSH from management subnet
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    src: "{{ lan_subnet }}.0/24"
    comment: "SSH from management"
  become: true

- name: UFW | Enable UFW
  community.general.ufw:
    state: enabled
  become: true