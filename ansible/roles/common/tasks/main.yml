# Baseline packages and firewall rules for every VM.
# Later roles like flask_app and postgres_server depend
# on this running first.

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    # Skips the update if the cache is fresh enough.
    # Value in seconds, set in group_vars/all.yml.
    cache_valid_time: "{{ apt_cache_valid_time }}"
  become: true

- name: Install baseline packages
  ansible.builtin.apt:
    name:
      - python3
      - python3-apt
      - python3-pip
      - sudo
      - curl
      - ca-certificates
      - gnupg
      - lsb-release
    state: present
  become: true

- name: Set timezone
  community.general.timezone:
    name: "{{ common_timezone }}"
  become: true

- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present
  become: true

# Order matters. Default deny, then SSH, then enable.
# Enabling before SSH is allowed locks out the playbook.
- name: UFW | Set default incoming policy to deny
  community.general.ufw:
    direction: incoming
    default: deny
  become: true

- name: UFW | Set default outgoing policy to allow
  community.general.ufw:
    direction: outgoing
    default: allow
  become: true

# Drops new SSH attempts after six tries in thirty
# seconds from the same sender. Stops brute force.
- name: UFW | Allow and rate-limit SSH from management
  community.general.ufw:
    rule: limit
    port: "22"
    proto: tcp
    src: "{{ lan_subnet }}.0/24"
    comment: "SSH from management with rate-limit"
  become: true

# Without this, Tailscale logins time out silently.
# UFW drops them, Proxmox lets them through.
- name: UFW | Allow and rate-limit SSH from Tailscale
  community.general.ufw:
    rule: limit
    port: "22"
    proto: tcp
    src: "100.64.0.0/10"
    comment: "SSH from Tailscale CGNAT with rate-limit"
  become: true

- name: UFW | Check status
  ansible.builtin.command: ufw status
  register: ufw_status_result
  changed_when: false
  become: true

# Enable flushes conntrack and kills Ansible's SSH.
# async + poll 0 means start it and move on, don't wait.
- name: UFW | Enable UFW
  community.general.ufw:
    state: enabled
  become: true
  async: 30
  poll: 0
  when: "'Status: active' not in ufw_status_result.stdout"

# Clears cached SSH sessions so the next task builds new ones.
- name: UFW | Reset SSH after firewall enable
  ansible.builtin.meta: reset_connection

# node_exporter publishes CPU, RAM, disk and network
# numbers on port 9100. Installed on every VM so
# Prometheus on monitor-01 can read them.
- name: Common | Install node_exporter
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
  become: true

- name: Common | Ensure node_exporter is enabled and running
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    enabled: true
    state: started
  become: true

# UFW denies incoming by default. Open 9100 only for
# monitor-01 so other VMs and external networks stay out.
- name: UFW | Allow node_exporter from monitor-01
  community.general.ufw:
    rule: allow
    port: "9100"
    proto: tcp
    src: "{{ monitor_ip }}"
    comment: "node_exporter from monitor-01"
  become: true
