# Unattended Debian 12 install for Packer. Produces the
# golden template (ID 9001) that all project VMs clone from.

# Locale set to Swedish region with English system language.
d-i debian-installer/locale string en_US.UTF-8
d-i debian-installer/language string en
d-i debian-installer/country string SE
d-i keyboard-configuration/xkb-keymap select se

# Network — interface auto-detected. Static IP is set via
# Packer boot_command before preseed is downloaded.
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string debian-gold
d-i netcfg/get_domain string local

# Package mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# Service account used by Ansible and cloud-init across the
# fleet. Root login disabled, SSH keys handle authentication.
d-i passwd/root-login boolean false
d-i passwd/user-fullname string automation
d-i passwd/username string automation
d-i passwd/user-password-crypted password $6$atc8mMB6XV63JEae$5HMc8JPiZys20wlG0PSZ1JdObCfphObAAtqSxZtitGB7xi2kFddRuB8Y19spZO9.bk9gkpWdreo2j0nYo9VC2.
d-i user-setup/encrypt-home boolean false

# Partitioning — single disk, one partition.
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Minimal install plus packages Terraform and Ansible need.
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo, qemu-guest-agent, curl, cloud-init
d-i pkgsel/upgrade select full-upgrade

# Boot loader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

# Reboot after install completes.
d-i finish-install/reboot_in_progress note

# Grants automation passwordless sudo so Ansible can
# escalate without interactive prompts.
d-i preseed/late_command string \
    in-target sh -c "echo 'automation ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/automation && chmod 440 /etc/sudoers.d/automation"