# Swedish Localization
d-i debian-installer/locale string en_US.UTF-8
d-i debian-installer/language string en
d-i debian-installer/country string SE
d-i keyboard-configuration/xkb-keymap select se

# Network configuration
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string debian-gold
d-i netcfg/get_domain string local

# Mirror settings
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# User account: This is where we fix our "admin" issue!
d-i passwd/root-login boolean false
d-i passwd/user-fullname string automation
d-i passwd/username string automation
d-i passwd/user-password password automation
d-i passwd/user-password-again password automation
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

# Partitioning (Standard "Guided - use entire disk")
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Package selection (Minimal install + SSH)
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo, qemu-guest-agent, curl, cloud-init
d-i pkgsel/upgrade select full-upgrade

# Boot loader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

# Final action (reboot)
d-i finish-install/reboot_in_progress note

# Late command: Set up passwordless sudo for the automation user
d-i preseed/late_command string \
    in-target sh -c "echo 'automation ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/automation && chmod 440 /etc/sudoers.d/automation"
