#cloud-config
# Sets up the control-node at first boot. Installs Ansible,
# clones the repo, configures Infisical access. Without this,
# every rebuild needs manual setup.

hostname: ${hostname}
fqdn: ${hostname}.local

# Shared service account across all VMs. Passwordless sudo
# lets Ansible run commands as root without prompts.
users:
  - name: automation
    groups: sudo
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ${sanjar_key}
      - ${jim_key}
      - ${automation_key}

package_update: true
package_upgrade: true

# pipx replaces apt's old Ansible 2.14. The Proxmox inventory
# plugin needs 2.17+, which Debian 12 doesn't ship.
packages:
  - pipx
  - git
  - python3-pip

write_files:
  - path: /home/automation/.ssh/id_ed25519
    owner: automation:automation
    permissions: "0600"
    content: |
      ${indent(6, automation_private_key)}

  # Infisical credentials for runtime lookups. The Proxmox
  # inventory plugin and db_password both read from here.
  # WORKSPACE_SUFFIX tells the inventory which VMs are ours
  # on a Proxmox host shared between teammates.
  - path: /etc/environment
    append: true
    content: |
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID=${infisical_client_id}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET=${infisical_client_secret}
      INFISICAL_PROJECT_ID=${infisical_project_id}
      INFISICAL_ENVIRONMENT=${infisical_environment}
      WORKSPACE_SUFFIX=${workspace_suffix}

# Cloud-init runs commands as root. "sudo -u automation"
# makes automation own the files, not root.
runcmd:
  - sudo -u automation git clone
    https://github.com/sanjarbsaraee/its25-virt-automation.git
    /home/automation/its25-virt-automation

  # pipx installs Ansible in an isolated venv. --include-deps
  # also installs ansible-galaxy, ansible-playbook, etc.
  - sudo -u automation pipx install --include-deps ansible

  # pipx venvs can't see system-wide pip packages. The Proxmox
  # plugin needs requests; the Infisical lookup needs the SDK.
  - sudo -u automation pipx inject ansible requests
  - sudo -u automation pipx inject ansible infisicalsdk

  # Adds ~/.local/bin to PATH so pipx binaries work in new
  # login shells without manual sourcing.
  - sudo -H -u automation pipx ensurepath

  # -p puts packages in ./collections, where Ansible looks.
  # Without it, packages land in ~/.ansible/.
  - sudo -u automation /home/automation/.local/bin/ansible-galaxy collection install -p
    /home/automation/its25-virt-automation/ansible/collections -r
    /home/automation/its25-virt-automation/ansible/collections/requirements.yml

  # Ensure the automation user owns EVERYTHING in the
  # project folder to avoid permission errors.
  - chown -R automation:automation /home/automation/its25-virt-automation
