#cloud-config
# Sets up the control-node at first boot. Installs Ansible,
# clones the repo, writes a list of VM addresses. Without
# this, every rebuild needs manual setup.

hostname: ${hostname}
fqdn: ${hostname}.local

# Shared service account across all VMs. Passwordless sudo
# lets Ansible run commands as root without prompts.
users:
  - name: automation
    groups: sudo
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ${sanjar_key}
      - ${jim_key}
      - ${automation_key}

package_update: true
package_upgrade: true

packages:
  - ansible
  - git
  - python3-pip

# Ansible needs VM names and IPs to know which machines
# to configure. This block writes that list at first boot.
write_files:
  - path: /tmp/hosts.yml
    owner: automation:automation
    permissions: "0644"
    content: |
      ${indent(6, inventory_content)}
  - path: /home/automation/.ssh/id_ed25519
    owner: automation:automation
    permissions: "0600"
    content: |
      ${indent(6, automation_private_key)}

# Cloud-init runs commands as root. "sudo -u automation"
# makes automation own the files, not root.
runcmd:
  - sudo -u automation git clone
    https://github.com/sanjarbsaraee/its25-virt-automation.git
    /home/automation/its25-virt-automation
  # Replaces the default address list in the repo with
  # actual VM IPs from Terraform.
  - mv /tmp/hosts.yml
    /home/automation/its25-virt-automation/ansible/inventories/prod/hosts.yml
  - chown automation:automation
    /home/automation/its25-virt-automation/ansible/inventories/prod/hosts.yml
  # -p puts packages in ./collections, where Ansible
  # looks. Without it, packages land in ~/.ansible/.
  - sudo -u automation ansible-galaxy collection install
    -p /home/automation/its25-virt-automation/ansible/collections
    -r /home/automation/its25-virt-automation/ansible/collections/requirements.yml