#cloud-config
hostname: ${hostname}
fqdn: ${hostname}.local
# Cloud-init config. Proxmox passes this to the VM at first boot.

users:
  - name: automation
    groups: sudo
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ${sanjar_key}
      - ${jim_key}

# Picks up fixes released since the template was built.
package_update: true
package_upgrade: true

packages:
  - ansible
  - git
  - python3-pip

# Write the inventory file to a temporary location first.
write_files:
  - path: /tmp/hosts.yml
    owner: automation:automation
    permissions: "0644"
    content: |
      ${indent(6, inventory_content)}

# Clones the repo and moves the inventory into place.
runcmd:
  - sudo -u automation git clone
    https://github.com/sanjarbsaraee/its25-virt-automation.git
    /home/automation/its25-virt-automation
  # Move the pre-written inventory into the cloned repo
  - mv /tmp/hosts.yml
    /home/automation/its25-virt-automation/ansible/inventories/prod/hosts.yml
  - chown automation:automation
    /home/automation/its25-virt-automation/ansible/inventories/prod/hosts.yml
  - sudo -u automation ansible-galaxy collection install -r
    /home/automation/its25-virt-automation/ansible/collections/requirements.yml
